<script>
var el_id = 'chart';
var navH   = 48;
var margin = {top: 4, right: 4, bottom: 4, left: 4},
    width  = window.innerWidth  - margin.left - margin.right,

];
var BUCKET_COLORS = ["#FF0000", "#FF5300", "#FFA500", "#FFD200", "#AEC6CF", "#80C000", "#008000", "#1ABC9C", "#2471A3"];
var color = d3.scaleOrdinal().domain(BUCKET_ORDER).range(BUCKET_COLORS);

var NO_FIT_NAME = "No Bucket Fit";
var NO_FIT_COLOR = "#8a8a8a";

// =====================================================================
// Dataset 1: SPECTER2 -- 3-level hierarchy (bucket -> topic -> subtopic
// cluster) with real document counts, from topics_specter2_auto.csv.
// =====================================================================
var SPECTER2_TOPICS = [
    { id: 0, size: 725, label: "insurance, trichocarpa, crop insurance, biosynthesis", subtopics: "sweetpotato, breeding, genetic, pine; powdery, mildew, powdery mildew, species; peanut, tillage, planting, corn; grafted, rootstocks, tomato, fruit; iron, arabidopsis, regulatory, dl; images, image, vision, computer; stem cell, cell, root, stem; maize, reg, inbred, pi; wheat, winter wheat, soft red, red winter; weed, palmer, palmer amaranth, amaranth; biorefineries, forest, ghg, mitigation; circadian, heat, fieldgrown, photosynthesis; pea, vetch, hairy, hairy vetch; insurance, crop insurance, crop, philippines; nematode, nematodes, enterolobii, meloidogyne; trichocarpa, biosynthesis, populus, pathway", bucket: "Policy and Society and Economics" },
    { id: 1, size: 333, label: "phosphorus, food safety, phosphate, safety", subtopics: "social, extension, governance, innovation; water quality, water, shellfish, coastal; soil, carbon, emissions, soc; lignin, lignocellulosic, waste, conversion; risk, nanomaterials, risk assessment, engineered nanomaterials; phosphorus, phosphate, lm, surplus; food safety, safety, vitamin, food", bucket: "Sustainable Ag and Resource Management" },

    { id: 5, size: 104, label: "biobotic, topological, segmentation, robotic", subtopics: "dogs, heart rate, wearable, heart; biobotic, topological, segmentation, robotic", bucket: "AgTech and Automation" },
    { id: 6, size: 80, label: "magnetic, mri, amplification, exchange", subtopics: "magnetic, mri, amplification, exchange", bucket: "Sensing and Imaging Technologies" },
    { id: 7, size: 73, label: "soil moisture, moisture, temperature sensing, dts", subtopics: "spectral, imaging, polarization, calibration; soil moisture, moisture, temperature sensing, dts", bucket: "Sensing and Imaging Technologies" },
    { id: 8, size: 48, label: "cmut, anodic bonding, bonding, anodic", subtopics: "cmut, ultrasound, transducer, array; cmut, anodic bonding, bonding, anodic", bucket: "Sensing and Imaging Technologies" },
    { id: 9, size: 43, label: "synthesis, natural products, natural, biofilms", subtopics: "synthesis, natural products, natural, biofilms", bucket: "Plant Ecology and Microbial Biology" },
    { id: 10, size: 37, label: "landscape, land, geospatial, urban", subtopics: "landscape, land, geospatial, urban", bucket: "Sustainable Ag and Resource Management" },
    { id: 11, size: 33, label: "power, electricity, wind, grid", subtopics: "power, electricity, wind, grid", bucket: "Sustainable Ag and Resource Management" },
    { id: 12, size: 26, label: "wireless, network, problem, service", subtopics: "wireless, network, problem, service", bucket: "AgTech and Automation" },
    { id: 13, size: 19, label: "fbg, optical fiber, fiber, bonded", subtopics: "fbg, optical fiber, fiber, bonded", bucket: "Sensing and Imaging Technologies" },
    { id: 14, size: 16, label: "lighting, leds, pf, light", subtopics: "lighting, leds, pf, light", bucket: "AgTech and Automation" }
];

function buildSpecter2Data() {
    var byBucketDisplay = {};
    BUCKET_ORDER.forEach(function (key, i) { byBucketDisplay[key] = BUCKET_DISPLAY_NAMES[i]; });

    var children = BUCKET_ORDER.map(function (bucketKey) {
        var displayName = byBucketDisplay[bucketKey];
        var topicsInBucket = SPECTER2_TOPICS.filter(function (t) { return t.bucket.toLowerCase() === bucketKey; });

        if (topicsInBucket.length === 0) {
            return { name: displayName, unmatched: true, value: 55 };
        }

        return {
            name: displayName,
            children: topicsInBucket.map(function (t) {
                var subGroups = t.subtopics.split(";").map(function (s) { return s.trim(); }).filter(Boolean);
                var perGroup = t.size / subGroups.length;
                return {
                    name: t.label,
                    topicSize: t.size,
                    children: subGroups.map(function (sg) {
                        return { name: sg, value: perGroup };
                    })
                };
            })
        };
    });

    return { name: " ", children: children };
}

// =====================================================================

// Buckets are matched per topic label.
// bucket: null means the topic didn't fit any of the 9 human-validated buckets.
// =====================================================================
var GTRT5_TOPICS = [
    { id: 0, size: 1638, label: "plasma, discharge, downy, inactivation", subtopics: "social, governance, community, students; weed, crop, peanut, ha; domain, piezoelectric, phase, electric; scaffolds, tissue, 3d, scaffold; carbon, soil, forest, emissions; spectral, imaging, polymer, polarization; salmonella, coli, isolates, amr; sweetpotato, ipomoea, batatas, storage; maize, breeding, selection, prediction; problem, wireless, vehicle, network; wearable, sensor, sensors, monitoring; iron, deficiency, transcription, stress; water quality, shellfish, water, waters; wheat, fusarium, srww, resistance; pine, families, pinus, tree; smartphone, nucleic, nucleic acid, detection; purification, ligands, peptide, affinity; rootstocks, tomato, rootstock, strawberry; qtl, linkage, markers, mapping; plasma, plasmas, cap, plasma treatment; drought, reflectance, leaf, dormancy; inactivation, log, cip, sprouts; downy, downy mildew, cucurbit, citri; discharge, wave, dielectric barrier, optical emission", bucket: "plant health and pathology and pest mgmt" },

    { id: 2, size: 80, label: "lignin, monolignol, pathway, biosynthesis", subtopics: "lactobacillus, acidophilus, strains, probiotic; monolignol, lignin, pathway, biosynthesis; lignin, lignocellulosic, poplar, conversion", bucket: "genetics and genomics" },
    { id: 3, size: 80, label: "raser, radiofrequency, stimulated emission, amplification stimulated", subtopics: "hyperpolarization, sabre, hyperpolarized, reversible exchange; raser, radiofrequency, stimulated emission, amplification stimulated", bucket: "sensing and imaging technologies" },
    { id: 4, size: 58, label: "transducer, micromachined, capacitive, ultrasonic", subtopics: "transducer, micromachined, capacitive, ultrasonic", bucket: "sensing and imaging technologies" },
    { id: 5, size: 52, label: "films, ferroelectric, hfo2, ferroelectricity", subtopics: "films, ferroelectric, hfo2, ferroelectricity", bucket: "sensing and imaging technologies" },
    { id: 6, size: 42, label: "powdery, powdery mildew, mildew, mildews", subtopics: "powdery, powdery mildew, mildew, mildews", bucket: "plant health and pathology and pest mgmt" },
    { id: 7, size: 41, label: "synthesis, natural products, natural, biofilms", subtopics: "synthesis, natural products, natural, biofilms", bucket: "plant ecology and microbial biology" },
    { id: 8, size: 30, label: "power, electricity, wind, grid", subtopics: "power, electricity, wind, grid", bucket: "sustainable ag and resource management" },
    { id: 9, size: 26, label: "dogs, dog, canine, heart rate", subtopics: "dogs, dog, canine, heart rate", bucket: null },
    { id: 10, size: 19, label: "biobotic, insects, biobots, topological", subtopics: "biobotic, insects, biobots, topological", bucket: "agtech and automation" },
    { id: 11, size: 17, label: "divisions, stem cell, stem, cell", subtopics: "divisions, stem cell, stem, cell", bucket: "genetics and genomics" },
    { id: 12, size: 15, label: "lighting, leds, pf, light", subtopics: "lighting, leds, pf, light", bucket: "agtech and automation" },
    { id: 13, size: 14, label: "soil moisture, moisture, distributed temperature, temperature sensing", subtopics: "soil moisture, moisture, distributed temperature, temperature sensing", bucket: "sensing and imaging technologies" },
    { id: 14, size: 13, label: "fbg, fiber, optical fiber, grating", subtopics: "fbg, fiber, optical fiber, grating", bucket: "sensing and imaging technologies" }
];

function buildGtrT5Data() {
    var byBucketDisplay = {};
    BUCKET_ORDER.forEach(function (key, i) { byBucketDisplay[key] = BUCKET_DISPLAY_NAMES[i]; });

    function topicNode(t) {
        var subGroups = t.subtopics.split(";").map(function (s) { return s.trim(); }).filter(Boolean);
        var perGroup = t.size / subGroups.length;
        return {
            name: t.label,
            topicSize: t.size,
            children: subGroups.map(function (sg) { return { name: sg, value: perGroup }; })
        };
    }

    var matchedTopics = GTRT5_TOPICS.filter(function (t) { return t.bucket !== null; });
    var noFitTopics = GTRT5_TOPICS.filter(function (t) { return t.bucket === null; });

    var children = BUCKET_ORDER.map(function (bucketKey) {
        var displayName = byBucketDisplay[bucketKey];
        var topicsInBucket = matchedTopics.filter(function (t) { return t.bucket === bucketKey; });

        if (topicsInBucket.length === 0) {
            return { name: displayName, unmatched: true, value: 55 };
        }

        return { name: displayName, children: topicsInBucket.map(topicNode) };
    });

    if (noFitTopics.length > 0) {
        children.push({ name: NO_FIT_NAME, noFit: true, children: noFitTopics.map(topicNode) });
    }

    return { name: " ", children: children };
}

// Everything here is loaded asynchronously from JSON; the treemap itself does not depend on it.
var ncsAuthorKeys = new Set();
var lastParentNode = null;

function ncsKeyFor(authorName) {
    var parts = authorName.split(",");
    if (parts.length < 2) return null;

    var last = parts[0].trim().toLowerCase();
    var first = parts[1].trim().split(/\s+/)[0].toLowerCase();

    return last + ", " + first;
}

function isNCSAuthor(authorName) {
    var key = ncsKeyFor(authorName);
    return !!key && ncsAuthorKeys.has(key);
}

// Populated from ncs_faculty_lookup.json: "last, first" -> {department, college}
var ncsFacultyInfo = {};

function getFacultyInfo(authorName) {
    var key = ncsKeyFor(authorName);
    return (key && ncsFacultyInfo[key]) || null;
}

// Populated from ncs_psi_keys.json: Set of "last, first" keys on the NC PSI faculty roster
var ncsPsiKeys = new Set();

function isNCPSI(authorName) {
    var key = ncsKeyFor(authorName);
    return !!key && ncsPsiKeys.has(key);
}

// Populated from ncs_author_topics.json: "last, first" -> {topics: [...], subtopics: [...]}
var ncsAuthorTopics = {};

// All top-level topics this author appears in besides the one currently being
// viewed, alphabetical (see README for why).
function getOtherTopics(authorName, currentTopic) {
    var key = ncsKeyFor(authorName);
    var info = key && ncsAuthorTopics[key];
    if (!info) return [];
    return info.topics.filter(function(t) { return t !== currentTopic; });
}

function downloadAuthorsCSV(subtopicName, authors, parentTopic) {
    var rows = ["Author Name,NC State Affiliation,Department,College,NC PSI,Other Topics"];
    authors.forEach(function(a) {
        var name = '"' + a.replace(/"/g, '""') + '"';
        var affiliation = isNCSAuthor(a) ? "Yes" : "No";
        var info = getFacultyInfo(a);
        var department = '"' + (info ? info.department.replace(/"/g, '""') : "") + '"';
        var college = '"' + (info ? info.college.replace(/"/g, '""') : "") + '"';
        var psi = isNCPSI(a) ? "Yes" : "No";
        var otherTopics = '"' + getOtherTopics(a, parentTopic).join(", ").replace(/"/g, '""') + '"';
        rows.push(name + "," + affiliation + "," + department + "," + college + "," + psi + "," + otherTopics);
    });

    var blob = new Blob([rows.join("\n")], {type: "text/csv;charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var safeName = subtopicName.toString().trim().replace(/[^a-z0-9]+/gi, "_").toLowerCase();

    var link = document.createElement("a");
    link.href = url;
    link.download = "authors_" + safeName + ".csv";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// =====================================================================
// Dataset 0: Human-validated buckets (same data as index.html) -- bucket ->
// subtopic, sized by number of papers. Loaded from jsonRETTL3.json; the
// per-paper leaves are collapsed to a count since only subtopics are drawn.
// =====================================================================
function buildHumanData(json) {
    return {
        name: " ",
        children: json.children.map(function (bucket) {
            // A paper/author can sit in several subtopics, so the bucket's own
            // paper and author counts are de-duplicated across its subtopics.
            var bucketPapers = new Set(), bucketAuthors = new Set();
            var subs = bucket.children.map(function (sub) {
                var titles = new Set((sub.children || []).map(function (p) { return p.name; }));
                titles.forEach(function (t) { bucketPapers.add(t); });
                (sub.authorList || []).forEach(function (a) { bucketAuthors.add(a); });
                return {
                    name: sub.name,
                    value: titles.size,
                    authorList: sub.authorList || [],
                    collabCount: sub.collabCount || 0
                };
            });
            return {
                name: bucket.name,
                uniquePapers: bucketPapers.size,
                uniqueAuthors: bucketAuthors.size,
                children: subs
            };
        })
    };
}

// ---------- Build both hierarchies + layouts once up front; switching tabs just swaps `root` ----------
var roots = {
    specter2: d3.hierarchy(buildSpecter2Data()),
    gtrt5: d3.hierarchy(buildGtrT5Data())
};
function layoutRoot(r) {
    return treemap(r
        .sum(function (d) { return d.value; })
        .sort(function (a, b) { return b.height - a.height || b.value - a.value; })
    );
}
Object.keys(roots).forEach(function (key) { layoutRoot(roots[key]); });

// ---------- Color: resolve each node's fill, independent of depth ----------
function fillColorFor(d) {
    if (d.data.unmatched) return { hex: "#eeeeee", opacity: 1, isHatch: true };
    if (d.data.noFit || (d.parent && d.parent.data && d.parent.data.noFit)) {
        return { hex: NO_FIT_COLOR, opacity: 0.85, isHatch: false };
    }
    var name = d.data.name ? d.data.name.toString().trim().toLowerCase() : "";
    var parent = d.parent && d.parent.data && d.parent.data.name ? d.parent.data.name.toString().trim().toLowerCase() : "";
    var grandparent = d.parent && d.parent.parent && d.parent.parent.data && d.parent.parent.data.name ? d.parent.parent.data.name.toString().trim().toLowerCase() : "";
    var hex = "#cccccc";
    if (BUCKET_ORDER.indexOf(name) !== -1) hex = color(name);
    else if (BUCKET_ORDER.indexOf(parent) !== -1) hex = color(parent);
    else if (BUCKET_ORDER.indexOf(grandparent) !== -1) hex = color(grandparent);
    return { hex: hex, opacity: d.depth === 3 ? 0.8 : 0.92, isHatch: false };
}

// ---------- WCAG-style contrast: pick black or white text for a given fill ----------
function hexToRgb(hex) {
    var m = hex.replace("#", "").match(/.{2}/g).map(function (h) { return parseInt(h, 16); });
    return { r: m[0], g: m[1], b: m[2] };
}
function blendOverWhite(hex, alpha) {
    var c = hexToRgb(hex);
    return {
        r: c.r * alpha + 255 * (1 - alpha),
        g: c.g * alpha + 255 * (1 - alpha),
        b: c.b * alpha + 255 * (1 - alpha)
    };
}
function relLuminance(rgb) {
    function ch(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * ch(rgb.r) + 0.7152 * ch(rgb.g) + 0.0722 * ch(rgb.b);
}
function contrastRatio(l1, l2) {
    var lighter = Math.max(l1, l2), darker = Math.min(l1, l2);
    return (lighter + 0.05) / (darker + 0.05);
}
function pickTextColor(hex, alpha) {
    var bgLum = relLuminance(blendOverWhite(hex, alpha));
    var withBlack = contrastRatio(bgLum, 0);
    var withWhite = contrastRatio(bgLum, 1);
    return withWhite > withBlack ? { title: "#ffffff", count: "rgba(255,255,255,0.85)" }
                                  : { title: "#141a1f", count: "rgba(20,26,31,0.65)" };
}

// ---------- Text sizing: a modest size proportional to each box's own dimensions,
// not a size maximized to fill the box. `ratio` sets the target as a fraction of the
// box's shorter side; targetMax/min are a sane comfort range, never a ceiling to fill up to.
var SIZE_CAPS = {
    1: { ratio: 0.075, targetMin: 15, targetMax: 34, countRatio: 0.42, countMin: 12 },
    2: { ratio: 0.07,  targetMin: 13, targetMax: 24, countRatio: 0.46, countMin: 11 },
    3: { ratio: 0.065, targetMin: 11, targetMax: 18, countRatio: 0.42, countMin: 10 }
};
var MIN_VISIBLE_W = 42, MIN_VISIBLE_H = 24;

// Starts at the modest formula-based target and only ever shrinks further if that
// target doesn't actually fit the box -- it never grows past the target to fill space.
function shrinkToFit(el, maxWidth, maxHeight, target, minSize) {
    function fitsAt(size) {
        el.style.fontSize = size + "px";
        // Words wrap only at spaces now (no break-word), so a real overflow shows up as a
        // large width gap; a few px of tolerance just absorbs subpixel layout rounding.
        return el.scrollWidth <= maxWidth + 3 && el.scrollHeight <= maxHeight + 0.5;
    }
    if (maxWidth <= 0 || maxHeight <= 0) { el.style.fontSize = minSize + "px"; return minSize; }
    if (fitsAt(target)) return target;
    var lo = minSize, hi = target, best = minSize;
    fitsAt(minSize);
    while (lo <= hi) {
        var mid = Math.floor((lo + hi) / 2);
        if (fitsAt(mid)) { best = mid; lo = mid + 1; }
        else { hi = mid - 1; }
    }
    el.style.fontSize = best + "px";
    return best;
}

function fitAllLabels(selection) {
    selection.each(function (d) {
        var container = this.querySelector(".textdiv");
        if (!container) return;
        var titleEl = container.querySelector(".title");
        if (!titleEl) return;
        var countEl = container.querySelector(".count");

        if (container.clientWidth < MIN_VISIBLE_W || container.clientHeight < MIN_VISIBLE_H) {
            container.style.visibility = "hidden";
            return;
        }
        container.style.visibility = "visible";

        var caps = SIZE_CAPS[d.depth] || SIZE_CAPS[3];
        var shortSide = Math.min(container.clientWidth, container.clientHeight);
        var pad = Math.max(8, Math.min(22, shortSide * 0.06));
        container.style.padding = pad + "px";

        var fillInfo = fillColorFor(d);
        var textColor = fillInfo.isHatch ? { title: "#2b2b2b", count: "rgba(43,43,43,0.7)" } : pickTextColor(fillInfo.hex, fillInfo.opacity);
        titleEl.style.color = textColor.title;
        if (countEl) countEl.style.color = textColor.count;

        var availW = container.clientWidth - 2 * pad;
        var availH = container.clientHeight - 2 * pad;
        var countAvailH = countEl ? Math.min(availH * 0.3, 30) : 0;
        var titleAvailH = availH - countAvailH;

        var target = Math.max(caps.targetMin, Math.min(caps.targetMax, shortSide * caps.ratio));
        var finalTitleSize = shrinkToFit(titleEl, availW, titleAvailH, target, caps.targetMin);

        if (countEl) {
            if (finalTitleSize <= caps.targetMin + 1 && titleAvailH < 30) {
                countEl.style.display = "none";
            } else {
                countEl.style.display = "";
                var countTarget = Math.max(caps.countMin, finalTitleSize * caps.countRatio);
                shrinkToFit(countEl, availW, countAvailH, countTarget, caps.countMin);
            }
        }
    });
}

        .html(function (d) {
            if (d.data.unmatched) {
                return '<p class="title">' + d.data.name + '</p>' + '<p class="count">No topics matched</p>';
            }
            if (activeKey === 'human') {
                return '<p class="title">' + d.data.name + '</p>' + '<p class="count">' + humanCountText(d) + '</p>';
            }
            if (d.depth === 1) {
                var topicCount = d.children ? d.children.length : 0;
                var countText = topicCount + ' topic' + (topicCount !== 1 ? 's' : '');
                countText += ' | ' + Math.round(d.value).toLocaleString() + ' docs';
                return '<p class="title">' + d.data.name + '</p>' + '<p class="count">' + countText + '</p>';
            } else if (d.depth === 2) {
                var subCount = d.children ? d.children.length : 0;
                return '<p class="title">' + d.data.name + '</p>' + '<p class="count">' + Math.round(d.data.topicSize || d.value).toLocaleString() + ' docs | ' + subCount + ' clusters</p>';
            }
            return '<p class="title">' + d.data.name + '</p>';
        })
        .attr("class", "textdiv");

    fitAllLabels(g);

    function transition(d) {
        if (transitioning || !d) return;
        transitioning = true;

        var g2 = display(d),
            t1 = g1.transition().duration(650),
            t2 = g2.transition().duration(650);
        x.domain([d.x0, d.x1]);
        y.domain([d.y0, d.y1]);
        svg.style("shape-rendering", null);
        svg.selectAll(".depth").sort(function (a, b) { return a.depth - b.depth; });
        g2.selectAll("text").style("fill-opacity", 0);
        g2.selectAll("foreignObject div").style("display", "none");
        t1.selectAll("text").style("fill-opacity", 0);
        t2.selectAll("text").style("fill-opacity", 1);
        t1.selectAll("rect").call(rect);
        t2.selectAll("rect").call(rect);
        t1.selectAll(".textdiv").style("display", "none");
        t1.selectAll(".foreignobj").call(foreign);
        t2.selectAll(".textdiv").style("display", "flex");
        t2.selectAll(".foreignobj").call(foreign);
        t1.on("end.remove", function () {
            this.remove();
            transitioning = false;
        });
        t2.on("end.fit", function () {
            fitAllLabels(g2);
        });
    }
    return g;
}

function rect(rect) {
    rect.attr("x", function (d) { return x(d.x0); })
        .attr("y", function (d) { return y(d.y0); })
        .attr("width", function (d) { return x(d.x1) - x(d.x0); })
        .attr("height", function (d) { return y(d.y1) - y(d.y0); })
        .attr("fill", function (d) { var f = fillColorFor(d); return f.isHatch ? "url(#hatch)" : f.hex; })
        .attr("opacity", function (d) { return fillColorFor(d).opacity; });
}

function foreign(foreign) {
    foreign.attr("x", function (d) { return x(d.x0); })
           .attr("y", function (d) { return y(d.y0); })
           .attr("width", function (d) { return x(d.x1) - x(d.x0); })
           .attr("height", function (d) { return y(d.y1) - y(d.y0); });
}

navigateTo = function (node) {
    d3.select("#authorList").remove();
    tooltip.style("display", "none");
    d3.selectAll(".depth").remove();
    transitioning = false;
    if (!node.parent) {
        x.domain([0, width]);
        y.domain([0, height]);
    } else {
        x.domain([node.x0, node.x1]);
        y.domain([node.y0, node.y1]);
    }
    display(node);
};

function switchDataset(key) {
    if (key === activeKey || !roots[key]) return;
    activeKey = key;
    d3.selectAll('.tab-btn').classed('active', function () {
        return this.getAttribute('data-key') === key;
    });
    tooltip.style('display', 'none');
    d3.select('#authorList').remove();
    d3.selectAll('.depth').remove();
    transitioning = false;
    x.domain([0, width]);
    y.domain([0, height]);
    root = roots[key];
    display(root);
}

d3.selectAll('.tab-btn').on('click', function () {
    switchDataset(this.getAttribute('data-key'));
});

function updateBreadcrumbFor(d) {
    if (!d.parent) {
        updateBreadcrumb([]);
        return;
    }
    var chain = d.ancestors().reverse();
    var segments = [{ label: 'All Buckets', node: root }];
    for (var i = 1; i < chain.length; i++) {
        var isLast = (i === chain.length - 1);
        segments.push({ label: chain[i].data.name, node: isLast ? null : chain[i] });
    }
    updateBreadcrumb(segments);
}

function updateBreadcrumb(segments) {
    var bc = d3.select('#breadcrumb');
    bc.html('');
    segments.forEach(function (seg, i) {
        if (i > 0) {
            bc.append('span').attr('class', 'bc-sep').text('›');
        }
        if (seg.node !== null) {
            bc.append('span')
              .attr('class', 'bc-link')
              .text(seg.label)
              .on('click', function () { navigateTo(seg.node); });
        } else {
            bc.append('span').attr('class', 'bc-current').text(seg.label);
        }
    });
}

// Hatch pattern for buckets with zero matched topics
var defs = svg.append("defs");
var pattern = defs.append("pattern")
    .attr("id", "hatch")
    .attr("width", 8).attr("height", 8)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", "rotate(45)");
pattern.append("rect").attr("width", 8).attr("height", 8).attr("fill", "#eeeeee");
pattern.append("rect").attr("width", 3).attr("height", 8).attr("fill", "#d6d6d6");

// ---------- Initial paint: Human-Validated tab (needs jsonRETTL3.json; falls back to SPECTER2) ----------
d3.json("jsonRETTL3.json", function (error, json) {
    if (error || !json) {
        console.warn("Human-validated data failed to load (serve the folder over http):", error);
        d3.select('.tab-btn[data-key="human"]')
            .style('display', 'none');
        activeKey = 'specter2';
        d3.selectAll('.tab-btn').classed('active', function () { return this.getAttribute('data-key') === activeKey; });
    } else {
        roots.human = layoutRoot(d3.hierarchy(buildHumanData(json)));
    }
    root = roots[activeKey];
    display(root);
});
</script>
